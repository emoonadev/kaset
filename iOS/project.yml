# XcodeGen spec for the Kaset iOS app (see docs/ios/PLAN.md).
# Generate with:  xcodegen generate --spec iOS/project.yml
# The generated iOS/KasetiOS.xcodeproj and iOS/Info.plist are git-ignored.
name: KasetiOS
options:
  bundleIdPrefix: dev.emoona
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
packages:
  # The repository root is the SwiftPM package that vends YouTubeAskCore.
  Kaset:
    path: ..
targets:
  KasetiOS:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/KasetiOS
    dependencies:
      - package: Kaset
        product: YouTubeAskCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Kaset
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Lets the debug log in Documents/ be pulled out through the Files app / Finder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.emoona.kaset
            CFBundleURLSchemes:
              - kaset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emoona.kaset
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
