# XcodeGen spec for the Kaset iOS app (see docs/ios/PLAN.md).
# Generate with:  xcodegen generate --spec iOS/project.yml
# The generated iOS/KasetiOS.xcodeproj and iOS/Info.plist are git-ignored.
name: KasetiOS
options:
  bundleIdPrefix: dev.emoona
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
packages:
  # The repository root is the SwiftPM package that vends YouTubeAskCore.
  Kaset:
    path: ..
targets:
  KasetiOS:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/KasetiOS
      - path: ../Sources/Kaset/Models
        excludes:
          - YouTube # video mode is out of v1 scope (D4); also needs `package` access into YouTubeAskCore
          - AI # S3+: needs FoundationModelsService / CommandExecutor (D4: no AI in v1)
      - path: ../Sources/Kaset/Utilities
        excludes:
          - MainWindowLayout.swift # AppKit window metrics
          - TextInputFocusState.swift # AppKit first responder
          - PlayerBarLayout.swift # depends on MainWindowLayout; replaced by an iOS mini player
          - LiquidGlassCompat.swift # macOS 15 fallback; iOS 26 uses glassEffect directly
          - IntelligenceModifier.swift # needs FoundationModelsService (D4)
          - AccessibilityIdentifiers.swift # extends a type declared in a macOS view; revisit in S7
      # Small service files the shared Models depend on.
      - path: ../Sources/Kaset/Services/API/Parsers/ParsingHelpers.swift
      - path: ../Sources/Kaset/Services/API/Parsers/ParsingHelpers+Metadata.swift
      - path: ../Sources/Kaset/Services/Library/LibraryContentIdentity.swift
    dependencies:
      - package: Kaset
        product: YouTubeAskCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Kaset
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Lets the debug log in Documents/ be pulled out through the Files app / Finder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.emoona.kaset
            CFBundleURLSchemes:
              - kaset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emoona.kaset
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
